name: Set up Bun
description: Set up Bun and install dependencies

inputs:
  bun-version:
    desctiption: Bun version
    required: false
    default: latest

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}
    
    - name: Install dependencies
      shell: bash
      run: bun ci