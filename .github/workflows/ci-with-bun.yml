name: CI (with bun)

on:
  workflow_call:
    inputs:
      bun-version:
        description: Bun version
        type: string
        required: false
        default: latest

      lint-script-name:
        description: Your linting script name
        type: string
        required: false
        default: lint

      typecheck-script-name:
        description: Your typecheck script name
        type: string
        required: false
        default: typecheck

      # builds
      do-build:
        description: Should this code be built?
        type: boolean
        required: false
        default: true

      build-script-name:
        description: Your build script name
        type: string
        required: false
        default: build

      package-source-type:
        description: What is your source type?
        # - typescript
        #   - pure-typescript
        # - javascript
        #   - pure-javascript # this source type does not need to build
        type: string
        required: true
        default: javascript

      # artifacts
      artifact-name:
        description: Your artifact's name
        type: string
        required: false
        default: artifact

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check Input Source Type
        env:
          PACKAGE_TYPE: ${{ inputs.package-source-type }}
        shell: bash
        run: |
          case "$PACKAGE_TYPE" in
            javascript|pure-javascript|typescript|pure-typescript)
              ;;
            *)
              echo "::error::${PACKAGE_TYPE} is not support type on here"
              exit 1
          esac

      - name: Checkout Target Repository
        uses: actions/checkout@v7

      - name: Check package.json
        run: |
          [ -f package.json ] || {
            echo "::error::package.json does not exists."
            exit 1
          }

      - name: Checkout eaglebot-workflows
        uses: actions/checkout@v7
        with:
          path: .workflow-tools
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}

      - name: Set up eaglebot-workflows Dependencies
        working-directory: .workflow-tools
        run: npm ci

      - name: Validate package.json By Node.js
        id: package-files
        env:
          SOURCE_TYPE: ${{ inputs.package-source-type }}
          PACKAGE_JSON_PATH: ./package.json
        run: |
          node ./.workflow-tools/scripts/ci-validate-package-json.js

      - name: Set up Bun
        uses: Team-Eagle-d/eaglebot-workflows/actions/setup-bun@v1
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Set up Project Dependencies
        run: bun ci

      - name: Lint
        run: bun run ${{ inputs.lint-script-name }}

      - name: Typecheck
        if: contains('pure-typescript', inputs.package-source-type)
        run: bun run ${{ inputs.typecheck-script-name }}

      - name: Build
        if: |
          inputs.do-build == true
          && contains('javascript,typescript', inputs.package-source-type) 
        run: bun run ${{ inputs.build-script-name }}

      - name: Make and Copy to Staging Directory
        if: inputs.do-build == true
        env:
          PACKAGE_TYPE: ${{ inputs.package-source-type }}
          PACKAGE_JSON_PATH: ./package.json
          ARTIFACT_PATH: ./artifact
        shell: bash
        run: |
          node ./.workflow-tools/scripts/ci-move-artifact.js
        
      - name: Upload Artifact
        if: inputs.do-build == true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: artifact/
